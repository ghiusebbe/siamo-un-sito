<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIAMO — prova il wordmark</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#080808;font:14px Helvetica,Arial,sans-serif}
main{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:clamp(20px,5vw,80px)}
header,footer{display:flex;justify-content:space-between;gap:24px}header{border-top:2px solid;padding-top:14px;font-weight:bold}
button{font:inherit;color:inherit;cursor:crosshair;background:none;border:0;padding:0;touch-action:pan-y}
#field{display:block;position:relative;width:100%;aspect-ratio:2200/546;margin:10vh 0}
canvas,img{position:absolute;inset:0;width:100%;height:100%}img{object-fit:contain}canvas{opacity:0}button:focus-visible{outline:2px solid;outline-offset:8px}
footer{color:#555;font-size:12px}#replay{cursor:pointer;text-decoration:underline}
@media(prefers-reduced-motion:reduce){canvas{display:none!important}img{opacity:1!important}}
</style>
</head>
<body><main>
<header><span>SIAMO®</span><span>CAMPO TIPOGRAFICO / 01</span></header>
<button id="field" aria-label="Anima il logo SIAMO"><img id="logo" src="LOGO_DATA" alt="SIAMO"><canvas aria-hidden="true"></canvas></button>
<footer><span>Muovi il cursore. Tocca per generare un’onda.</span><button id="replay">Ricomponi ↗</button></footer>
</main><script>
/* RENDERER */
const field=document.querySelector('#field'), canvas=document.querySelector('canvas'), logo=document.querySelector('#logo'),ctx=canvas.getContext('2d');
const reduced=matchMedia('(prefers-reduced-motion:reduce)');
let start=0, frame=0, last=0, pulseStart=-Infinity, target=0;
const pointer={x:-9999,y:-9999,strength:0},pulse={x:1100,y:273,age:99};
function schedule(){if(!frame&&!reduced.matches&&!document.hidden&&logo.complete&&logo.naturalWidth)frame=requestAnimationFrame(paint)}
function paint(now){frame=0;const dt=Math.min((now-(last||now))/1000,.05);last=now;pointer.strength+=(target-pointer.strength)*(1-Math.exp(-dt*12));pulse.age=(now-pulseStart)/1000;const t=(now-start)/1000;drawWordmark(ctx,logo,t,pointer,pulse);canvas.style.opacity=1;logo.style.opacity=0;if(t<DURATION||pulse.age<1.6||Math.abs(target-pointer.strength)>.001)schedule()}
function resize(){const box=field.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(box.width*dpr);canvas.height=Math.round(box.height*dpr);ctx.setTransform(canvas.width/WIDTH,0,0,canvas.height/HEIGHT,0,0);schedule()}
function locate(e){const box=field.getBoundingClientRect();pointer.x=(e.clientX-box.left)/box.width*WIDTH;pointer.y=(e.clientY-box.top)/box.height*HEIGHT}
field.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;locate(e);target=1;schedule()},{passive:true});
field.addEventListener('pointerdown',locate,{passive:true});
for(const event of ['pointerleave','pointercancel','blur'])field.addEventListener(event,()=>{target=0;schedule()});
field.addEventListener('click',e=>{pulse.x=e.detail===0?1100:pointer.x;pulse.y=e.detail===0?273:pointer.y;pulseStart=performance.now();schedule()});
document.querySelector('#replay').onclick=()=>{start=performance.now();schedule()};
reduced.addEventListener('change',()=>{if(reduced.matches){cancelAnimationFrame(frame);frame=0;logo.style.opacity=1;canvas.style.opacity=0}else{start=performance.now();schedule()}});
document.addEventListener('visibilitychange',schedule);
new ResizeObserver(resize).observe(field);
function begin(){start=performance.now();resize()}if(logo.complete)begin();else logo.onload=begin;
</script></body></html>
